# Local development overrides. Loaded automatically by Docker Compose
# when you run `docker compose` without an explicit `-f` file list.
services:
  api:
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
    # Publish API only for local debugging; gateway remains the primary entrypoint.
    ports:
      - "8000:8000"

  worker:
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
      WORKER_POLL_INTERVAL_SECONDS: "5"

  web:
    build:
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
        PUBLIC_MEDIA_FLOW_ENABLED: ${PUBLIC_MEDIA_FLOW_ENABLED:-false}
        PUBLIC_SEARCH_INDEXING_ENABLED: ${PUBLIC_SEARCH_INDEXING_ENABLED:-false}

  gateway:
    ports:
      - "8080:8080"
