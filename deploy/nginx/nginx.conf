worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time rid=$http_x_request_id';
    # Browser-grant content: never log raw request-line, query, Cookie, or Auth.
    # $uri is the normalized path without $args. Fragments are not sent by browsers.
    log_format browser_grant_delivery '$remote_addr - - [$time_local] '
                    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                    'rt=$request_time rid=$req_id';
    access_log /dev/stdout main;

    # Upstream names match Compose service DNS names.
    upstream fetchnow_web {
        server web:8080;
    }

    upstream fetchnow_api {
        server api:8000;
    }

    # `delivery` is deliberately not an upstream block. Names in an upstream are
    # resolved when the config loads, so an absent or crash-looping delivery
    # would keep the whole gateway from starting and take the frontend down with
    # it. Per-request resolution through the Docker embedded DNS confines that
    # failure to a 502 on the delivery route.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 5s;

    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    server {
        listen 8080;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Frontend
        location / {
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
            add_header Cross-Origin-Opener-Policy "same-origin" always;
            add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'none'; connect-src 'self'" always;
            proxy_pass http://fetchnow_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Exact authenticated artifact delivery route → dedicated delivery service.
        # Regex is evaluated before the prefix /api/ location so create/status
        # remain on api while content streaming stays off the API volume boundary.
        # No X-Accel-Redirect, no filesystem path rewrite, no response buffering.
        # Quoted because nginx parses an unquoted "{" as a block opener.
        location ~ "^/api/v1/media/download-jobs/[0-9a-fA-F-]{36}/content$" {
            # $request_uri keeps the original path and query, which a proxy_pass
            # without a URI part would otherwise pass on implicitly.
            set $fetchnow_delivery "delivery:8000";
            proxy_pass http://$fetchnow_delivery$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            # Do not override upstream Cache-Control / private delivery headers.
            proxy_hide_header X-Powered-By;
        }

        # Exact browser-native grant content route → delivery (cookie auth).
        # Grant issuance POST stays on /api/ (api service). Only this content
        # shape is routed to delivery; arbitrary /browser-grants paths are not.
        # Exact path only: no query ($args), no trailing slash, UUID4 grammar.
        # Browser fragments are never transmitted on the wire.
        location ~ "^/api/v1/media/browser-grants/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/content$" {
            access_log /dev/stdout browser_grant_delivery;
            if ($args != "") {
                return 404;
            }
            set $fetchnow_delivery "delivery:8000";
            # $uri only — never forward a query string even if $args were empty-looking.
            proxy_pass http://$fetchnow_delivery$uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_hide_header X-Powered-By;
        }

        # API (create/status/validate/probe/resolve/jobs)
        location /api/ {
            proxy_pass http://fetchnow_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
