worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time rid=$http_x_request_id';
    access_log /dev/stdout main;

    # Upstream names match Compose service DNS names.
    upstream fetchnow_web {
        server web:8080;
    }

    upstream fetchnow_api {
        server api:8000;
    }

    upstream fetchnow_delivery {
        server delivery:8000;
    }

    map $http_x_request_id $req_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    server {
        listen 8080;
        server_name _;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;

        # Frontend
        location / {
            proxy_pass http://fetchnow_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Exact authenticated artifact delivery route → dedicated delivery service.
        # Regex is evaluated before the prefix /api/ location so create/status
        # remain on api while content streaming stays off the API volume boundary.
        # No X-Accel-Redirect, no filesystem path rewrite, no response buffering.
        location ~ ^/api/v1/media/download-jobs/[0-9a-fA-F-]{36}/content$ {
            proxy_pass http://fetchnow_delivery;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_max_temp_file_size 0;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            # Do not override upstream Cache-Control / private delivery headers.
            proxy_hide_header X-Powered-By;
        }

        # API (create/status/validate/probe/resolve/jobs)
        location /api/ {
            proxy_pass http://fetchnow_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $req_id;
            proxy_set_header Connection "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
