# Optional production-shaped compose fragment (no host API exposure).
# Usage:
#   docker compose --project-name fetchnow-prod \
#     -f compose.yaml -f deploy/compose/compose.prod.yaml up -d --build
#
# For staging, prefer compose.staging.yaml (loopback gateway + fail-closed secrets).
services:
  api:
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO

  worker:
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO

  delivery:
    environment:
      APP_ENV: production
      LOG_LEVEL: INFO

  gateway:
    ports:
      - "${GATEWAY_PORT:-80}:8080"
