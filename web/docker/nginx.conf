worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 128;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    access_log    /dev/stdout combined;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        # Keep Location headers relative so TLS-terminating gateways stay correct.
        absolute_redirect off;

        # Canonical trailing-slash redirects for directory landings.
        location = /vk { return 308 /vk/; }
        location = /rutube { return 308 /rutube/; }
        location = /ok { return 308 /ok/; }
        location = /dzen { return 308 /dzen/; }
        location = /privacy { return 308 /privacy/; }
        location = /terms { return 308 /terms/; }
        location = /copyright { return 308 /copyright/; }

        # Exact files and directory indexes only — never soft-200 unknown routes.
        location / {
            include /etc/nginx/robots-headers.inc;
            try_files $uri $uri/ =404;
        }
    }
}
