[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "fetchnow"
version = "0.1.0"
description = "FetchNow API and worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy[asyncio]==2.0.42",
    "alembic==1.16.4",
    "asyncpg==0.31.0",
    "pydantic-settings==2.14.2",
    "httpx==0.28.1",
    # Metadata-only CLI for PR4 inspection adapter (invoked via subprocess, not
    # imported into request handlers). Disabled by default via Settings.
    "yt-dlp==2026.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.1.0",
    "httpx==0.28.1",
    "ruff==0.12.7",
    "mypy==1.17.1",
]

[tool.uv]
required-version = "==0.12.19"
# No environments= restriction: resolve across requires-python (>=3.12).
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Isolated build of this project. Not installed into the runtime environment.
# Hashes are the wheel and sdist from the first uv 0.12.19 resolution of
# hatchling==1.32.4. Regenerate only in a reviewed lock update.
build-constraint-dependencies = [
    { requirement = "hatchling==1.32.4", hashes = [
        "sha256:08ecf7548fb48205e7f213d70c71e67b8271b7242093dc3f1da578b42c734a2c",
        "sha256:c4468f73144c054d2aab4ef0f0378c43b9878bf07f8ffd6b79690e970d375f07",
    ] },
    { requirement = "packaging==26.3", hashes = [
        "sha256:94edc256424af38762eb31306eed28beb9f0efc50a8837492c9d6fd6004aed79",
        "sha256:d7193f7c8e4e93f444fde0262bf90af30e16fa0ad0ad44cb553c87339b23cd1c",
    ] },
    { requirement = "pathspec==1.1.1", hashes = [
        "sha256:17db5ecd524104a120e173814c90367a96a98d07c45b2e10c2f3919fff91bf5a",
        "sha256:a00ce642f577bf7f473932318056212bc4f8bfdf53128c78bbd5af0b9b20b189",
    ] },
    { requirement = "pluggy==1.6.0", hashes = [
        "sha256:7dcc130b76258d33b90f61b658791dede3486c3e6bfb003ee5c9bfb396dd22f3",
        "sha256:e920276dd6813095e9377c0bc5566d94c932c33b27a3e3945d8389c374dd4746",
    ] },
    { requirement = "tomlkit==0.15.1", hashes = [
        "sha256:177a05aece5a8ca5266fd3c448abb47b8d352f09d477d3ca8332db4d89b24304",
        "sha256:e25bbf38843005246210a12982776f27f99cb9be67160e14434d0c0d21ee1e97",
    ] },
    { requirement = "trove-classifiers==2026.9.21.13", hashes = [
        "sha256:0a9ebc8d4e2f3e8a22848c5258033035bec17a3012ac3fea16dbaa764489eb71",
        "sha256:8b1ff4f9c191b1040b71c37f1e445ab99732911e3cd91de52838453a854d7a17",
    ] },
]

[project.scripts]
fetchnow-api = "fetchnow.api.main:run"
fetchnow-worker = "fetchnow.worker:run"
fetchnow-delivery = "fetchnow.delivery.main:run"
fetchnow-storage-init = "fetchnow.downloads.storage_init:run"

[tool.hatch.build.targets.wheel]
packages = ["src/fetchnow"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["fetchnow"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
