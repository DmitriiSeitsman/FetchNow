            --project-file "${RUNNER_TEMP}/fetchnow-bootstrap-project.txt" \
            --repo-root "${GITHUB_WORKSPACE}"
          python3 scripts/release_bootstrap_db_ci_cleanup.py \
            --project-file "${RUNNER_TEMP}/fetchnow-bootstrap-dirty-project.txt" \
            --repo-root "${GITHUB_WORKSPACE}"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assert Node meets web engines
        run: |
          set -euo pipefail
          node -e "const [maj,min]=process.versions.node.split('.').map(Number); const ok=(maj===22 && min>=12) || maj>=24; if (!ok) { console.error('Need Node ^22.12.0 || >=24.0.0, got', process.versions.node); process.exit(1); } console.log('Node', process.versions.node);"
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: http://localhost
          PUBLIC_MEDIA_FLOW_ENABLED: "false"
          PUBLIC_SEARCH_INDEXING_ENABLED: "false"
      - name: Build with media flow enabled
        run: npm run build
        env:
          PUBLIC_SITE_URL: http://localhost
          PUBLIC_MEDIA_FLOW_ENABLED: "true"
          PUBLIC_SEARCH_INDEXING_ENABLED: "false"
      - name: Build with search indexing enabled
        run: npm run build
        env:
          PUBLIC_SITE_URL: http://localhost
          PUBLIC_MEDIA_FLOW_ENABLED: "false"
          PUBLIC_SEARCH_INDEXING_ENABLED: "true"
      - name: Assert fail-closed robots meta
        run: |
          PUBLIC_SITE_URL=http://localhost PUBLIC_SEARCH_INDEXING_ENABLED=false npm run build
          grep -q 'name="robots" content="noindex,nofollow"' dist/index.html
          grep -q 'lang="ru"' dist/index.html
          grep -q 'Allow: /' dist/robots.txt
          ! grep -q 'Disallow: /' dist/robots.txt
          ! grep -q 'Sitemap:' dist/robots.txt
          grep -q '<urlset' dist/sitemap.xml
          ! grep -q '<loc>' dist/sitemap.xml
          PUBLIC_SITE_URL=https://fetchnow.online PUBLIC_SEARCH_INDEXING_ENABLED=true npm run build
          grep -q 'name="robots" content="index,follow"' dist/index.html
          grep -q 'Sitemap: https://fetchnow.online/sitemap.xml' dist/robots.txt
          grep -q 'https://fetchnow.online/vk/' dist/sitemap.xml
          if PUBLIC_SEARCH_INDEXING_ENABLED=yes npm run build; then echo "expected invalid indexing flag to fail"; exit 1; fi
          if PUBLIC_SITE_URL=https://fetchnow.online/foo PUBLIC_SEARCH_INDEXING_ENABLED=true npm run build; then echo "expected invalid site url to fail"; exit 1; fi
          if env -u PUBLIC_SITE_URL PUBLIC_SEARCH_INDEXING_ENABLED=true npm run build; then echo "expected missing site url with indexing to fail"; exit 1; fi

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: |
            3.12
            3.14.7
      - name: Install uv 0.12.19
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              asset=uv-x86_64-unknown-linux-gnu.tar.gz
              want=23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8
              ;;
            aarch64|arm64)
              asset=uv-aarch64-unknown-linux-gnu.tar.gz
              want=0804e9b164c64b6914182d5920c08551958a095986f10a3731056df701126436
              ;;
            *)
              echo "unsupported architecture $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/astral-sh/uv/releases/download/0.12.19/$asset"
          echo "$want  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${asset%.tar.gz}" >> "$GITHUB_PATH"
      - name: Install audit tooling (isolated)
        run: |
          set -euo pipefail
          # Bootstrap pip from the freshly created venv installs only the hashed
          # tool pins below. Do not float-upgrade pip here — that is outside the
          # hashed audit environment and is not claimed as part of reproducibility.
          python3.12 -m venv "$RUNNER_TEMP/dependency-audit-venv"
          "$RUNNER_TEMP/dependency-audit-venv/bin/python" -m pip install \
            --require-hashes --no-deps \
            -r scripts/requirements/dependency-audit.txt
          "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" --version
      - name: Install pytest for fixture tests
        run: |
          set -euo pipefail
          python3.12 -m pip install --require-hashes --no-deps \
            -r backend/ci/pytest-requirements.txt
      - name: Fixture unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3.12 -m pytest -q tests/dependency_audit
      - name: Dependency audit gate
        run: |
          set -euo pipefail
          export UV_PYTHON_DOWNLOADS=never
          PYTHONPATH=scripts "$RUNNER_TEMP/dependency-audit-venv/bin/python" \
            scripts/dependency_audit.py \
            --pip-audit-bin "$RUNNER_TEMP/dependency-audit-venv/bin/pip-audit" \
            --uv-bin uv \
            --report-out "$RUNNER_TEMP/dependency-audit-report.json"

  image-audit:
    name: Image audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      FETCHNOW_IMAGE_AUDIT_TAG: sec03c-ci
      FETCHNOW_TRIVY_VERSION: "0.74.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pytest for fixture tests
        run: |
          set -euo pipefail
          python3.12 -m pip install --require-hashes --no-deps \
            -r backend/ci/pytest-requirements.txt
      - name: Fixture unit tests
        run: |
          set -euo pipefail
          PYTHONPATH=scripts python3.12 -m pytest -q tests/image_audit
      - name: Install Trivy 0.74.0 (checksum-pinned)
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              asset=trivy_0.74.0_Linux-64bit.tar.gz
              want=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
              ;;
            aarch64|arm64)
              asset=trivy_0.74.0_Linux-ARM64.tar.gz
              want=b94ce1976bbf3c15b514b605ee88be7c6d94a29be2302847ff01cb794d47aad5
              ;;
            *)
              echo "unsupported architecture $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/aquasecurity/trivy/releases/download/v0.74.0/$asset"
          echo "$want  $RUNNER_TEMP/$asset" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/trivy-bin/trivy" version | tee "$RUNNER_TEMP/trivy-version.txt"
          grep -q 'Version: 0.74.0' "$RUNNER_TEMP/trivy-version.txt"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build disposable runtime images (linux/amd64)
        run: |
          set -euo pipefail
          rev="${GITHUB_SHA}"
          docker build --platform linux/amd64 \
            --build-arg "FETCHNOW_RELEASE_REVISION=${rev}" \
            -t "fetchnow-api:${FETCHNOW_IMAGE_AUDIT_TAG}" \
            ./backend
          docker build --platform linux/amd64 \
            --build-arg "FETCHNOW_RELEASE_REVISION=${rev}" \
            --build-arg PUBLIC_SITE_URL=http://localhost \
            --build-arg PUBLIC_SEARCH_INDEXING_ENABLED=false \
            -t "fetchnow-web:${FETCHNOW_IMAGE_AUDIT_TAG}" \
            ./web
          docker build --platform linux/amd64 \
            --build-arg "FETCHNOW_RELEASE_REVISION=${rev}" \
            -t "fetchnow-gateway:${FETCHNOW_IMAGE_AUDIT_TAG}" \
            ./deploy/nginx
          docker pull --platform linux/amd64 postgres:16.15-alpine3.24
      - name: Write targets and run image audit gate
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fetchnow-sec03c-work"
          cache="$RUNNER_TEMP/fetchnow-sec03c-trivy-cache"
          mkdir -p "$work" "$cache"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag = os.environ["FETCHNOW_IMAGE_AUDIT_TAG"]
          targets = {
              "api": f"fetchnow-api:{tag}",
              "web": f"fetchnow-web:{tag}",
              "gateway": f"fetchnow-gateway:{tag}",
              "postgres": "postgres:16.15-alpine3.24",
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "fetchnow-sec03c-targets.json"
          path.write_text(json.dumps(targets, indent=2) + "\n", encoding="utf-8")
          print(path)
          PY
          set +e
          PYTHONPATH=scripts python3.12 scripts/image_audit.py \
            --trivy-bin trivy \
            --cache-dir "$cache" \
            --targets-file "$RUNNER_TEMP/fetchnow-sec03c-targets.json" \
            --expected-platform linux/amd64 \
            --work-dir "$work" \
            --summary-out "$RUNNER_TEMP/fetchnow-sec03c-summary.json"
          gate_rc=$?
          set -e
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(
              Path(os.environ["RUNNER_TEMP"], "fetchnow-sec03c-summary.json").read_text()
          )
          # Safe console summary only (already sanitized by the gate).
          print("status:", summary.get("status"))
          print("db:", json.dumps(summary.get("db"), sort_keys=True))
          for row in summary.get("targets", []):
              ident = row.get("identity") or {}
              print(
                  f"{row.get('name')}: status={row.get('status')} "
                  f"id={ident.get('image_id')} platform={ident.get('platform')} "
                  f"counts={row.get('counts')}"
              )
          print("findings:", len(summary.get("findings") or []))
          PY
          exit "$gate_rc"
      - name: Upload sanitized summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec03c-image-audit-summary
          path: ${{ runner.temp }}/fetchnow-sec03c-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup disposable images and task Trivy cache
        if: always()
        run: |
          set -euo pipefail
          tag="${FETCHNOW_IMAGE_AUDIT_TAG}"
          docker image rm -f \
            "fetchnow-api:${tag}" \
            "fetchnow-web:${tag}" \
            "fetchnow-gateway:${tag}" \
            || true
          # Only the task-local cache directory created above — not ~/.cache/trivy.
          if [[ -d "$RUNNER_TEMP/fetchnow-sec03c-trivy-cache" ]]; then
            trivy --cache-dir "$RUNNER_TEMP/fetchnow-sec03c-trivy-cache" clean --all || true
            rm -rf "$RUNNER_TEMP/fetchnow-sec03c-trivy-cache"
          fi
          rm -rf "$RUNNER_TEMP/fetchnow-sec03c-work" || true

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Compose contract check
        run: python3 scripts/compose_contract_check.py
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: fetchnow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          tags: fetchnow-web:ci
          build-args: |
            PUBLIC_SITE_URL=http://localhost
            PUBLIC_SEARCH_INDEXING_ENABLED=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/nginx
          push: false
          tags: fetchnow-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
