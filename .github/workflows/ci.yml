name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: fetchnow
          POSTGRES_PASSWORD: fetchnow
          POSTGRES_DB: fetchnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fetchnow -d fetchnow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fetchnow:fetchnow@localhost:5432/fetchnow
      FETCHNOW_TEST_DATABASE_URL: postgresql+asyncpg://fetchnow:fetchnow@localhost:5432/fetchnow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv 0.12.19
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              asset=uv-x86_64-unknown-linux-gnu.tar.gz
              want=23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8
              ;;
            aarch64|arm64)
              asset=uv-aarch64-unknown-linux-gnu.tar.gz
              want=0804e9b164c64b6914182d5920c08551958a095986f10a3731056df701126436
              ;;
            *)
              echo "unsupported architecture $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/astral-sh/uv/releases/download/0.12.19/$asset"
          echo "$want  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${asset%.tar.gz}" >> "$GITHUB_PATH"
      - name: Install
        run: |
          set -euo pipefail
          export UV_PYTHON_DOWNLOADS=never
          uv lock --check
          uv sync --frozen --extra dev --python 3.12
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
      - name: Check pytest CI requirements match the lock
        run: |
          set -euo pipefail
          python - <<'PY'
          """Regenerate expected pytest-requirements.txt and compare bytes.

          Algorithm (must match docs/operations/sec-03b-python-lock.md):
          1. Parse uv.lock; take transitive closure of \"pytest\" (all lock edges).
          2. uv export --frozen --extra dev --no-emit-project --no-header --no-annotate
          3. Keep only requirement blocks whose name is in that closure.
          4. Sort by package name; prepend the fixed header; compare to
             ci/pytest-requirements.txt (exact bytes).
          """
          from __future__ import annotations

          import subprocess
          import tomllib
          from pathlib import Path

          HEADER = (
              "# Generated from backend/uv.lock (pytest transitive closure).\n"
              "# Do not edit by hand. Regeneration: see docs/operations/sec-03b-python-lock.md\n"
              "# Install: python -m pip install --require-hashes --no-deps -r backend/ci/pytest-requirements.txt\n"
              "#\n"
          )

          lock = tomllib.loads(Path("uv.lock").read_text())
          pkgs = {pkg["name"]: pkg for pkg in lock["package"]}

          def closure(name: str, acc: set[str] | None = None) -> set[str]:
              acc = set() if acc is None else acc
              if name in acc:
                  return acc
              if name not in pkgs:
                  raise SystemExit(f"package {name!r} missing from uv.lock")
              acc.add(name)
              for dep in pkgs[name].get("dependencies") or []:
                  closure(dep["name"], acc)
              return acc

          wanted = closure("pytest")
          export = subprocess.check_output(
              [
                  "uv",
                  "export",
                  "--frozen",
                  "--extra",
                  "dev",
                  "--no-emit-project",
                  "--no-header",
                  "--no-annotate",
              ],
              text=True,
          )
          blocks: dict[str, str] = {}
          current: list[str] = []

          def flush() -> None:
              if not current:
                  return
              name = current[0].split("==", 1)[0].strip()
              blocks[name] = "".join(current).rstrip() + "\n"
              current.clear()

          for line in export.splitlines(True):
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              if line[:1].isspace():
                  if current:
                      current.append(line)
                  continue
              flush()
              current = [line]
          flush()

          missing = wanted - set(blocks)
          if missing:
              raise SystemExit(f"export missing closure members: {sorted(missing)}")
          for name in sorted(wanted):
              ver = pkgs[name]["version"]
              if not blocks[name].startswith(f"{name}=={ver}"):
                  raise SystemExit(f"{name}: export pin != lock {ver}")

          expected = HEADER + "\n".join(blocks[n] for n in sorted(wanted))
          if not expected.endswith("\n"):
              expected += "\n"
          actual = Path("ci/pytest-requirements.txt").read_text()
          if actual != expected:
              raise SystemExit(
                  "ci/pytest-requirements.txt is stale or manually edited; "
                  "regenerate per docs/operations/sec-03b-python-lock.md"
              )
          foreign = set(blocks) - wanted
          # blocks may contain more packages from full export; we only emit wanted
          print(
              f"pytest CI requirements match regenerated export "
              f"({len(wanted)} packages: {sorted(wanted)})"
          )
          PY
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q

  pg-backup:
    name: Postgres backup unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ci/pytest-requirements.txt
      - name: Install pytest
        run: python -m pip install --require-hashes --no-deps -r backend/ci/pytest-requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/pg_backup

  pg-backup-integration:
    name: Postgres backup restore integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Postgres backup restore integration
        id: pg_backup_integration
        env:
          # Surfaced into make_project_name() for per-run uniqueness.
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/pg_backup_integration_test.py \
            --project-file "${RUNNER_TEMP}/fetchnow-pg-backup-project.txt"
      - name: Cleanup Postgres backup integration project
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/pg_backup_ci_cleanup.py \
            --project-file "${RUNNER_TEMP}/fetchnow-pg-backup-project.txt" \
            --compose-file compose.yaml \
            --repo-root "${GITHUB_WORKSPACE}"

  release-unit:
    name: Release preflight unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ci/pytest-requirements.txt
      - name: Install pytest
        run: python -m pip install --require-hashes --no-deps -r backend/ci/pytest-requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/release

  release-ancestry-integration:
    name: Release trusted-main ancestry integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Temporary Git ancestry + positive preflight
        run: |
          set -euo pipefail
          python3 scripts/release_ancestry_integration_test.py

  release-health-integration:
    name: Release health integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Release health integration
        id: release_health_integration
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release_health_integration_test.py \
            --project-file "${RUNNER_TEMP}/fetchnow-health-project.txt"
      - name: Cleanup release health integration project
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/release_health_ci_cleanup.py \
            --project-file "${RUNNER_TEMP}/fetchnow-health-project.txt" \
            --repo-root "${GITHUB_WORKSPACE}"

  release-build-unit:
    name: Release materialization unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ci/pytest-requirements.txt
      - name: Install pytest
        run: python -m pip install --require-hashes --no-deps -r backend/ci/pytest-requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/release/test_release_build_unit.py

  release-build-integration:
    name: Release materialization build integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Exact-revision release prepare integration
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release_build_integration_test.py

  release-rollout-unit:
    name: Release rollout transaction unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ci/pytest-requirements.txt
      - name: Install pytest
        run: python -m pip install --require-hashes --no-deps -r backend/ci/pytest-requirements.txt
      - name: Unit tests
        run: python -m pytest -q tests/release/test_rollout_unit.py tests/release/test_current_state_unit.py tests/release/test_config_rollout_unit.py

  release-rollout-integration:
    name: Release rollout transaction integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Release rollout integration
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release_rollout_integration_test.py \
            --project-file "${RUNNER_TEMP}/fetchnow-rollout-project.txt"
      - name: Cleanup release rollout integration project
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/release_rollout_ci_cleanup.py \
            --project-file "${RUNNER_TEMP}/fetchnow-rollout-project.txt" \
            --repo-root "${GITHUB_WORKSPACE}"

  release-gateway-routing-integration:
    name: Release gateway routing integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Gateway routing integration
        id: release_gateway_routing_integration
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release_gateway_routing_integration_test.py \
            --project-file "${RUNNER_TEMP}/fetchnow-routing-project.txt"
      - name: Cleanup gateway routing integration project
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/release_gateway_routing_ci_cleanup.py \
            --project-file "${RUNNER_TEMP}/fetchnow-routing-project.txt" \
            --repo-root "${GITHUB_WORKSPACE}"

  release-deploy-plan-unit:
    name: Migration contract and deploy-plan unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ci/pytest-requirements.txt
      - name: Install pytest
        run: python -m pip install --require-hashes --no-deps -r backend/ci/pytest-requirements.txt
      - name: Unit tests
        run: |
          python -m pytest -q tests/release/test_deploy_plan_unit.py tests/release/test_source_contract_unit.py tests/release/test_current_state_unit.py tests/pg_backup/test_alembic_graph.py

  release-deploy-plan-integration:
    name: Migration contract and deploy-plan integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Deploy-plan integration
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release_deploy_plan_integration_test.py \
            --project-file "${RUNNER_TEMP}/fetchnow-deploy-plan-project.txt"
      - name: Cleanup deploy-plan integration project
        if: always()
        run: |
          set -euo pipefail
            python3 scripts/release_deploy_plan_ci_cleanup.py \
            --project-file "${RUNNER_TEMP}/fetchnow-deploy-plan-project.txt" \
            --repo-root "${GITHUB_WORKSPACE}"

  release-migration-unit:
    name: Migration transaction unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/ci/pytest-requirements.txt
      - name: Install pytest
        run: python -m pip install --require-hashes --no-deps -r backend/ci/pytest-requirements.txt
      - name: Unit tests
        run: |
          python -m pytest -q \
            tests/release/test_migration_journal_unit.py \
            tests/release/test_migrate_unit.py \
            tests/release/test_migration_recover_unit.py \
            tests/pg_backup/test_retention_hold_unit.py

  release-migration-integration:
    name: Migration transaction integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Migration transaction integration
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release_migration_integration_test.py \
            --project-file "${RUNNER_TEMP}/fetchnow-migration-project.txt"
      - name: Cleanup migration integration project
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/release_migration_ci_cleanup.py \
            --project-file "${RUNNER_TEMP}/fetchnow-migration-project.txt" \
            --repo-root "${GITHUB_WORKSPACE}"

  release-bootstrap-db-integration:
    name: Initial database bootstrap integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Pre-pull pinned Postgres image
        run: |
          set -euo pipefail
          docker pull postgres:16.9-alpine
          docker image inspect postgres:16.9-alpine >/dev/null
      - name: Initial DB bootstrap integration
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 scripts/release_bootstrap_db_integration_test.py \
            --project-file "${RUNNER_TEMP}/fetchnow-bootstrap-project.txt" \
            --dirty-project-file "${RUNNER_TEMP}/fetchnow-bootstrap-dirty-project.txt"
      - name: Cleanup bootstrap integration project
        if: always()
        run: |
          set -euo pipefail
          python3 scripts/release_bootstrap_db_ci_cleanup.py \
            --project-file "${RUNNER_TEMP}/fetchnow-bootstrap-project.txt" \
            --repo-root "${GITHUB_WORKSPACE}"
          python3 scripts/release_bootstrap_db_ci_cleanup.py \
            --project-file "${RUNNER_TEMP}/fetchnow-bootstrap-dirty-project.txt" \
            --repo-root "${GITHUB_WORKSPACE}"

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Assert Node meets web engines
        run: |
          set -euo pipefail
          node -e "const [maj,min]=process.versions.node.split('.').map(Number); const ok=(maj===22 && min>=12) || maj>=24; if (!ok) { console.error('Need Node ^22.12.0 || >=24.0.0, got', process.versions.node); process.exit(1); } console.log('Node', process.versions.node);"
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: http://localhost
          PUBLIC_MEDIA_FLOW_ENABLED: "false"
          PUBLIC_SEARCH_INDEXING_ENABLED: "false"
      - name: Build with media flow enabled
        run: npm run build
        env:
          PUBLIC_SITE_URL: http://localhost
          PUBLIC_MEDIA_FLOW_ENABLED: "true"
          PUBLIC_SEARCH_INDEXING_ENABLED: "false"
      - name: Build with search indexing enabled
        run: npm run build
        env:
          PUBLIC_SITE_URL: http://localhost
          PUBLIC_MEDIA_FLOW_ENABLED: "false"
          PUBLIC_SEARCH_INDEXING_ENABLED: "true"
      - name: Assert fail-closed robots meta
        run: |
          PUBLIC_SITE_URL=http://localhost PUBLIC_SEARCH_INDEXING_ENABLED=false npm run build
          grep -q 'name="robots" content="noindex,nofollow"' dist/index.html
          grep -q 'lang="ru"' dist/index.html
          grep -q 'Allow: /' dist/robots.txt
          ! grep -q 'Disallow: /' dist/robots.txt
          ! grep -q 'Sitemap:' dist/robots.txt
          grep -q '<urlset' dist/sitemap.xml
          ! grep -q '<loc>' dist/sitemap.xml
          PUBLIC_SITE_URL=https://fetchnow.online PUBLIC_SEARCH_INDEXING_ENABLED=true npm run build
          grep -q 'name="robots" content="index,follow"' dist/index.html
          grep -q 'Sitemap: https://fetchnow.online/sitemap.xml' dist/robots.txt
          grep -q 'https://fetchnow.online/vk/' dist/sitemap.xml
          if PUBLIC_SEARCH_INDEXING_ENABLED=yes npm run build; then echo "expected invalid indexing flag to fail"; exit 1; fi
          if PUBLIC_SITE_URL=https://fetchnow.online/foo PUBLIC_SEARCH_INDEXING_ENABLED=true npm run build; then echo "expected invalid site url to fail"; exit 1; fi
          if env -u PUBLIC_SITE_URL PUBLIC_SEARCH_INDEXING_ENABLED=true npm run build; then echo "expected missing site url with indexing to fail"; exit 1; fi

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Compose contract check
        run: python3 scripts/compose_contract_check.py
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: fetchnow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          tags: fetchnow-web:ci
          build-args: |
            PUBLIC_SITE_URL=http://localhost
            PUBLIC_SEARCH_INDEXING_ENABLED=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/nginx
          push: false
          tags: fetchnow-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
