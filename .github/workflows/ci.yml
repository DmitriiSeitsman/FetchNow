name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Pytest
        run: pytest -q

  pg-backup:
    name: Postgres backup unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.4.1
      - name: Unit tests
        run: python -m pytest -q tests/pg_backup

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          PUBLIC_SITE_URL: http://localhost

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify Docker Compose v2
        run: docker compose version
      - name: Compose contract check
        run: python3 scripts/compose_contract_check.py
      - name: Postgres backup integration
        id: pg_backup_integration
        run: |
          python3 scripts/pg_backup_integration_test.py \
            --project-file "${RUNNER_TEMP}/fetchnow-pg-backup-project.txt"
      - name: Cleanup Postgres backup integration project
        if: always()
        run: |
          set -euo pipefail
          PROJECT_FILE="${RUNNER_TEMP}/fetchnow-pg-backup-project.txt"
          if [[ ! -f "${PROJECT_FILE}" ]]; then
            echo "No project file; nothing to clean"
            exit 0
          fi
          PROJECT="$(tr -d '[:space:]' < "${PROJECT_FILE}")"
          case "${PROJECT}" in
            fetchnow|fetchnow-staging|fetchnow-prod|fetchnow-backup-test|"")
              echo "Refusing to clean forbidden project: '${PROJECT}'"
              exit 1
              ;;
          esac
          if [[ ! "${PROJECT}" =~ ^fetchnow-backup-test-[a-z0-9]{8,32}$ ]]; then
            echo "Refusing unsafe project name: '${PROJECT}'"
            exit 1
          fi
          echo "Cleaning Compose project ${PROJECT}"
          docker compose --project-name "${PROJECT}" -f compose.yaml down -v --remove-orphans || true
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: fetchnow-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          tags: fetchnow-web:ci
          build-args: |
            PUBLIC_SITE_URL=http://localhost
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./deploy/nginx
          push: false
          tags: fetchnow-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
