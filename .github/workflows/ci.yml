name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: fetchnow
          POSTGRES_PASSWORD: fetchnow
          POSTGRES_DB: fetchnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fetchnow -d fetchnow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://fetchnow:fetchnow@localhost:5432/fetchnow
      FETCHNOW_TEST_DATABASE_URL: postgresql+asyncpg://fetchnow:fetchnow@localhost:5432/fetchnow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv 0.12.19
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              asset=uv-x86_64-unknown-linux-gnu.tar.gz
              want=23bf5552d220e0842b65c862097b2ebaeba0064b74eda5e565e77fd25969d8c8
              ;;
            aarch64|arm64)
              asset=uv-aarch64-unknown-linux-gnu.tar.gz
              want=0804e9b164c64b6914182d5920c08551958a095986f10a3731056df701126436
              ;;
            *)
              echo "unsupported architecture $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/$asset" \
            "https://github.com/astral-sh/uv/releases/download/0.12.19/$asset"
          echo "$want  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${asset%.tar.gz}" >> "$GITHUB_PATH"
      - name: Install
        run: |
          set -euo pipefail
          export UV_PYTHON_DOWNLOADS=never
          uv lock --check
          uv sync --frozen --extra dev --python 3.12
          echo "$GITHUB_WORKSPACE/backend/.venv/bin" >> "$GITHUB_PATH"
      - name: Check pytest CI requirements match the lock
        run: |
          set -euo pipefail
          python - <<'PY'
          """Regenerate expected pytest-requirements.txt and compare bytes.

          Algorithm (must match docs/operations/sec-03b-python-lock.md):
          1. Parse uv.lock; take transitive closure of \"pytest\" (all lock edges).
          2. uv export --frozen --extra dev --no-emit-project --no-header --no-annotate
          3. Keep only requirement blocks whose name is in that closure.
          4. Sort by package name; prepend the fixed header; compare to
             ci/pytest-requirements.txt (exact bytes).
          """
          from __future__ import annotations

          import subprocess
          import tomllib
          from pathlib import Path

          HEADER = (
              "# Generated from backend/uv.lock (pytest transitive closure).\n"
              "# Do not edit by hand. Regeneration: see docs/operations/sec-03b-python-lock.md\n"
              "# Install: python -m pip install --require-hashes --no-deps -r backend/ci/pytest-requirements.txt\n"
              "#\n"
          )

          lock = tomllib.loads(Path("uv.lock").read_text())
          pkgs = {pkg["name"]: pkg for pkg in lock["package"]}

          def closure(name: str, acc: set[str] | None = None) -> set[str]:
              acc = set() if acc is None else acc
              if name in acc:
                  return acc
              if name not in pkgs:
                  raise SystemExit(f"package {name!r} missing from uv.lock")
              acc.add(name)
              for dep in pkgs[name].get("dependencies") or []:
                  closure(dep["name"], acc)
              return acc

          wanted = closure("pytest")
          export = subprocess.check_output(
              [
                  "uv",
                  "export",
                  "--frozen",
                  "--extra",
                  "dev",
                  "--no-emit-project",
                  "--no-header",
                  "--no-annotate",
              ],
              text=True,
          )
          blocks: dict[str, str] = {}
          current: list[str] = []

          def flush() -> None:
              if not current:
                  return
              name = current[0].split("==", 1)[0].strip()
              blocks[name] = "".join(current).rstrip() + "\n"
              current.clear()

          for line in export.splitlines(True):
              if not line.strip() or line.lstrip().startswith("#"):
                  continue
              if line[:1].isspace():
                  if current:
                      current.append(line)
                  continue
              flush()
              current = [line]
          flush()

          missing = wanted - set(blocks)
          if missing:
              raise SystemExit(f"export missing closure members: {sorted(missing)}")
          for name in sorted(wanted):
              ver = pkgs[name]["version"]
              if not blocks[name].startswith(f"{name}=={ver}"):
                  raise SystemExit(f"{name}: export pin != lock {ver}")

          expected = HEADER + "\n".join(blocks[n] for n in sorted(wanted))
          if not expected.endswith("\n"):
              expected += "\n"
          actual = Path("ci/pytest-requirements.txt").read_text()
          if actual != expected:
              raise SystemExit(
                  "ci/pytest-requirements.txt is stale or manually edited; "
                  "regenerate per docs/operations/sec-03b-python-lock.md"
              )
          foreign = set(blocks) - wanted
          # blocks may contain more packages from full export; we only emit wanted
          print(
              f"pytest CI requirements match regenerated export "
              f"({len(wanted)} packages: {sorted(wanted)})"
          )
          PY
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src
      - name: Alembic upgrade
        run: alembic upgrade head
      - name: Pytest
        run: pytest -q

  backend-candidate-a:
    name: Backend Candidate A (native amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: fetchnow
          POSTGRES_PASSWORD: fetchnow
          POSTGRES_DB: fetchnow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fetchnow -d fetchnow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FETCHNOW_CANDIDATE_A_TEST_TAG: sec03c-candidate-a-test
      # Service publishes to the job host; container uses host network (not compose).
      FETCHNOW_TEST_DATABASE_URL: postgresql+asyncpg://fetchnow:fetchnow@127.0.0.1:5432/fetchnow
      DATABASE_URL: postgresql+asyncpg://fetchnow:fetchnow@127.0.0.1:5432/fetchnow
    steps:
      - uses: actions/checkout@v7
      - name: Require native Linux x86_64 (no QEMU acceptance)
        run: |
          set -euo pipefail
          uname -a | tee "$RUNNER_TEMP/candidate-a-uname.txt"
          uname -m | tee "$RUNNER_TEMP/candidate-a-machine.txt"
          test "$(cat "$RUNNER_TEMP/candidate-a-machine.txt")" = "x86_64"
          test "$(uname -s)" = "Linux"
          docker info --format '{{.Architecture}}' | tee "$RUNNER_TEMP/candidate-a-docker-arch.txt"
          test "$(cat "$RUNNER_TEMP/candidate-a-docker-arch.txt")" = "x86_64"
          echo "native_linux_amd64_ok=1"
      - name: Build Candidate A test image (Dockerfile test stage, host arch)
        run: |
          set -euo pipefail
          # No --platform: build host-native only. Do not route through QEMU.
          docker build \
            --target test \
            --build-arg "FETCHNOW_RELEASE_REVISION=${GITHUB_SHA}" \
            -t "fetchnow-api-test:${FETCHNOW_CANDIDATE_A_TEST_TAG}" \
            ./backend
          docker image inspect "fetchnow-api-test:${FETCHNOW_CANDIDATE_A_TEST_TAG}" \
            --format '{{.Os}}/{{.Architecture}}' | tee "$RUNNER_TEMP/candidate-a-image-platform.txt"
          test "$(cat "$RUNNER_TEMP/candidate-a-image-platform.txt")" = "linux/amd64"
      - name: Focused process/storage gate (UID 10001)
        id: focused
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/candidate-a-pytest"
          # Runtime topology note:
          # - Canonical runtime: USER 10001, CMD ["fetchnow-api"], no docker --init.
          # - This job: same UID via --user 10001:10001, command overridden to pytest,
          #   no --init / tini (process/signal topology matches runtime; not a test-only
          #   init wrapper to make kills pass).
          docker run --rm \
            --name "fetchnow-canda-focused-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --user 10001:10001 \
            --network host \
            -e HOME=/tmp \
            -e PYTEST_ADDOPTS="-o cache_dir=/tmp/pytest-cache" \
            -e FETCHNOW_TEST_DATABASE_URL="${FETCHNOW_TEST_DATABASE_URL}" \
            -e DATABASE_URL="${DATABASE_URL}" \
            -v "$RUNNER_TEMP/candidate-a-pytest:/tmp/pytest-out:rw" \
            "fetchnow-api-test:${FETCHNOW_CANDIDATE_A_TEST_TAG}" \
            bash -c '
              set -euo pipefail
              python - <<PY
              import json, os, platform, shutil, sys
              meta = {
                  "python": sys.version.split()[0],
                  "executable": sys.executable,
                  "machine": platform.machine(),
                  "platform": platform.platform(),
                  "uid": os.getuid(),
                  "gid": os.getgid(),
                  "ffmpeg": shutil.which("ffmpeg"),
                  "ffprobe": shutil.which("ffprobe"),
              }
              print(json.dumps(meta, sort_keys=True))
              assert meta["python"] == "3.14.7", meta
              assert meta["uid"] == 10001 and meta["gid"] == 10001, meta
              assert meta["machine"] == "x86_64", meta
              assert meta["ffmpeg"] and meta["ffprobe"], meta
              PY
              pytest -q --tb=short \
                tests/test_mux_process.py \
                tests/test_download_process.py \
                tests/test_media_inspection_process.py \
                tests/test_storage_init.py \
                tests/test_lease_watchdog.py \
                tests/test_process_descendant_diag.py \
                2>&1 | tee /tmp/pytest-out/focused.log
            '
      - name: Full backend suite (UID 10001)
        run: |
          set -euo pipefail
          docker run --rm \
            --name "fetchnow-canda-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --user 10001:10001 \
            --network host \
            -e HOME=/tmp \
            -e PYTEST_ADDOPTS="-o cache_dir=/tmp/pytest-cache" \
            -e FETCHNOW_TEST_DATABASE_URL="${FETCHNOW_TEST_DATABASE_URL}" \
            -e DATABASE_URL="${DATABASE_URL}" \
            -v "$RUNNER_TEMP/candidate-a-pytest:/tmp/pytest-out:rw" \
            "fetchnow-api-test:${FETCHNOW_CANDIDATE_A_TEST_TAG}" \
            bash -c '
              set -euo pipefail
              pytest -q --tb=line 2>&1 | tee /tmp/pytest-out/full.log
            '
      - name: Upload Candidate A pytest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec03c-candidate-a-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-a-pytest/
            ${{ runner.temp }}/candidate-a-uname.txt
            ${{ runner.temp }}/candidate-a-machine.txt
            ${{ runner.temp }}/candidate-a-docker-arch.txt
            ${{ runner.temp }}/candidate-a-image-platform.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Cleanup Candidate A test image
        if: always()
        run: |
          set -euo pipefail
          docker rm -f \
            "fetchnow-canda-focused-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            "fetchnow-canda-full-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            2>/dev/null || true
          docker image rm -f "fetchnow-api-test:${FETCHNOW_CANDIDATE_A_TEST_TAG}" || true
          rm -rf "$RUNNER_TEMP/candidate-a-pytest" || true

